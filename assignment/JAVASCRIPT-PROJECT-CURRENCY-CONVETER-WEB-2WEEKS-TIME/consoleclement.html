<body style="background-color: blanchedalmond; align-items: center;    margin: 0;
    padding: 0; box-sizing: border-box; display:block;   justify-content: space-between;">
    <div class="container">
  <h1 style=" font-size: 55px;">Currency Converter</h1>
    <p>Convert currencies in real-time using live exchange rates</p>

    <div class="converter">
        <input type="number" id="amount" placeholder="Enter amount">
<br>
        <!-- Dropdown-one -->
    <select id="dropdown-one">
        <option value="USD">USD<option>
        <option value="NGN">NGN<option>
        <option value="EUR">EUR<option>
        <option value="GBP">GBP<option>
    </select>
        <!-- Dropdown-two -->
    <select id="dropdown-two">
        <option value="USD">USD<option>
        <option value="NGN">NGN<option>
        <option value="EUR">EUR<option>
        <option value="GBP">GBP<option>
    </select> 

    <br>

    <button onclick="convertcurrency()">
        Convert
    </button>

    <div class="result" id="result"></div>
    </div>
    <script>   
    async function convertcurrency() {
        const amount = document.getElementById("amount").value; 
        const from = document.getElementById("dropdown-one").value;
        const to = document.getElementById("dropdown-two").value;

        if(amount === ""){
            alert("Enter amount");
            return;
        }
        try {
            const response = await fetch(`https://api.exchangerate-api.com/v4/latest/${from}`);
            const data = await response.json();

            const rate = data.rates[to];
            const result = amount * rate;

            document.getElementById("result").innerHTML =amount
            `${amount} ${result.toFixed(2)} ${to}`;
        } catch (error){
            document.getElementById("result").innerHTML = "Error fetching data"
        }

    }
      //  const document.getelementbyid,("")
        // console.log("\u{1F600}")
    </script>
